[custom]
; 自定义订阅转换配置
; 用法：在订阅转换工具的「远程配置」里填本文件的 raw 地址：
; https://raw.githubusercontent.com/tiger-git2022/Clash-Rule/main/subconverter.ini
; 分流规则来自 blackmatrix7/ios_rule_script，与原订阅的分组一致
; 转换链接请用 expand=false：规则以 rule-providers 引用，由客户端自行下载

; 去掉机场的流量/到期/官网提示节点
exclude_remarks=(剩余流量|过期时间|官网)

; ---------- 规则（从上到下匹配） ----------
; 局域网
ruleset=🏠 国内直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
; 本仓库的自定义规则
ruleset=🤖 AI网站,clash-classic:https://raw.githubusercontent.com/tiger-git2022/Clash-Rule/main/ai-sites.yaml
ruleset=🐼 E站看图,clash-classic:https://raw.githubusercontent.com/tiger-git2022/Clash-Rule/main/ehentai-sites.yaml
ruleset=🇯🇵 日本节点,clash-classic:https://raw.githubusercontent.com/tiger-git2022/Clash-Rule/main/japan-sites.yaml
; 必须直连的服务
ruleset=🏠 国内直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.yaml
; B站/爱奇艺/腾讯视频/芒果TV 的海外版与 API 域名，归国内流媒体（默认直连）
ruleset=🎬 国内流媒体,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/AsianMedia/AsianMedia.yaml
; 游戏下载（国内有 CDN）
ruleset=🎮 游戏平台直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/GameDownloadCN/GameDownloadCN.yaml
ruleset=🎮 游戏平台直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/SteamCN/SteamCN.yaml
; 已知的国外网站
ruleset=🌐 国外流量,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global_Classical.yaml
; 国内
ruleset=🎬 国内流媒体,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.yaml
ruleset=🏠 国内直连,clash-classic:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China_Classical.yaml
ruleset=🏠 国内直连,[]GEOIP,CN
; 剩下的全部
ruleset=🚥 其他流量,[]FINAL

; ---------- 分组 ----------
custom_proxy_group=🌐 国外流量`select`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`.*
custom_proxy_group=🇭🇰 香港节点`select`香港
custom_proxy_group=🇯🇵 日本节点`select`日本
custom_proxy_group=🇹🇼 台湾节点`select`台湾
; AI 网站不走香港节点
custom_proxy_group=🤖 AI网站`select`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`^(?!.*香港).*$
custom_proxy_group=🐼 E站看图`select`[]🌐 国外流量`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`.*
custom_proxy_group=🎮 游戏平台直连`select`[]DIRECT`[]🌐 国外流量
custom_proxy_group=🎬 国内流媒体`select`[]DIRECT`[]🇭🇰 香港节点`[]🇹🇼 台湾节点
custom_proxy_group=🏠 国内直连`select`[]DIRECT`[]🌐 国外流量
custom_proxy_group=🚥 其他流量`select`[]🌐 国外流量`[]🏠 国内直连

enable_rule_generator=true
overwrite_original_rules=true
